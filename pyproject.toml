[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "council-core"
version = "0.0.1"
description = "Generic multi-model council engine with predefined packs and dynamic persona generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
google = ["google-genai>=0.3"]
all = ["openai>=1.0", "anthropic>=0.39", "google-genai>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
council = "council_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
council_core = ["prompts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
