schema_version: 1
id: dev_cursor
version: 1.0.0
display_name: Dev Council (Cursor SDK)

# Opt-in pack: do not compete with the free-provider `dev` pack on routing.
# Invoke explicitly: `council run --pack dev_cursor ...`
routing:
  triggers:
    - cursor council
    - grounded review
    - cursor sdk review

council:
  personas_file: personas.yaml

prompts:
  directory: prompts

grounding:
  provider: git_repo

output:
  schema: dev_review_v1

execution:
  policy_file: execution.yaml
