schema_id: travel_verdict_v1
required_sections:
  - Day-by-day skeleton
  - Book now
  - Risks
  - Alternatives
skeleton: |
  ## Travel Verdict: <trip name or corridor>
  _Convened: <advisors> — mode: <mode>_

  ### Day-by-day skeleton
  <decisive multi-day plan: overnight hubs, drive legs with realistic times, meal anchors, family pacing — not a vague wishlist>

  ### Book now
  <time-sensitive reservations, timed-entry tickets, and non-food access that must be secured first — with deadlines>

  ### Risks
  <feasibility and irreversibility: overpacked days, border/docs, cancellation windows, budget realism, Stop / Proceed / Proceed-after-verify>

  ### Where the council disagreed
  <genuine disagreement — both sides>

  ### Alternatives
  <1–2 concrete alternate days or route/food swaps if a booking fails or energy collapses>

  ### Still unverified
  <distances, hours, booking rules, and other facts to confirm before locking the plan>
