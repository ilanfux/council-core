schema_id: career_verdict_v1
required_sections:
  - Recommendation
  - Where the fit is weak
  - Next actions
skeleton: |
  ## Career Verdict: <decision or target role>
  _Convened: <advisors> — mode: <mode>_

  ### Recommendation
  <the decisive call — pursue / adjust / hold — not "it depends">

  ### Fit for the target
  <level realism and evidence of impact/scope at the target bar, in both markets where relevant>

  ### Where the fit is weak
  <the Skeptic's concrete gaps: what screens the candidate out or fails an interview>

  ### Positioning & materials
  <narrative, resume/LinkedIn/ATS notes, and any authenticity flags from the ghostwriter pass>

  ### Where the council disagreed
  <genuine disagreement — advocate vs skeptic, both sides>

  ### Next actions
  <the smallest set of concrete, high-leverage next steps>

  ### Still unverified
  <facts to confirm before acting (comp bands, JD must-haves, timelines)>
